<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 960" width="1024" height="960" role="img" aria-labelledby="t d">
  <title id="t">Shopify generative AI tools: Magic and Sidekick</title>
  <desc id="d">Generative AI branching into Shopify Magic and Shopify Sidekick, automating content, personalisation, support and visuals.</desc>

  <style>
    .h  { font: 700 37px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .sub{ font: 400 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .ct { font: 700 24px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .cb { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .n  { font: 700 16px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #F17E3F; }
    .hub { font: 700 24px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .chip { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .lead { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .fb { font: 700 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .fs { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #B8C6C2; }
    .card { fill: #FFFFFF; stroke: #E2EAE8; stroke-width: 1.5; }
    .ico { fill: none; stroke: #F17E3F; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .wire { fill: none; stroke: #C6D6D2; stroke-width: 2.4; }
  </style>

  <rect width="1024" height="960" fill="#F3F7F6"/>
  <g stroke="#DCE8E4" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M0 146 L108 190 L182 116"/>
    <path d="M1024 180 L940 228 L872 176"/>
    <path d="M48 886 L140 826 L240 872"/>
  </g>
  <g fill="#DCE8E4">
    <circle cx="108" cy="190" r="5"/><circle cx="182" cy="116" r="3.5"/>
    <circle cx="940" cy="228" r="5"/><circle cx="872" cy="176" r="3.5"/>
    <circle cx="140" cy="826" r="5"/><circle cx="240" cy="872" r="3.5"/>
  </g>

  <text class="h" x="64" y="92">Shopify's Gen AI Toolset</text>
  <text class="sub" x="64" y="128">Two tools, one shift in how a store gets built and run.</text>

  <!-- hub -->
  <rect x="384" y="180" width="256" height="76" rx="18" fill="#16221F"/>
  <rect x="384" y="180" width="5" height="76" rx="2.5" fill="#F17E3F"/>
  <text class="hub" x="424" y="226">Generative AI</text>

  <path class="wire" d="M512 256 V288 H280 V320"/>
  <path class="wire" d="M512 256 V288 H744 V320"/>

  <!-- Shopify Magic -->
  <g>
    <rect class="card" x="64" y="320" width="432" height="268" rx="16"/>
    <rect x="64" y="320" width="5" height="268" rx="2.5" fill="#F17E3F"/>
    <circle cx="112" cy="368" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(103 358)">
      <path d="M9 1 L11 7 L17 9 L11 11 L9 17 L7 11 L1 9 L7 7 z"/>
    </g>
    <text class="n" x="144" y="361">TOOL 1</text>
    <text class="ct" x="144" y="388">Shopify Magic</text>
    <g>
      <circle cx="104" cy="438" r="5" fill="#F17E3F"/>
      <text class="cb" x="124" y="444">Product descriptions and blog posts</text>
      <circle cx="104" cy="482" r="5" fill="#F17E3F"/>
      <text class="cb" x="124" y="488">FAQ answers and email subject lines</text>
      <circle cx="104" cy="526" r="5" fill="#F17E3F"/>
      <text class="cb" x="124" y="532">Image backgrounds, changed in place</text>
    </g>
    <text class="cb" x="96" y="568">Works from your prompt, inside the admin.</text>
  </g>

  <!-- Shopify Sidekick -->
  <g>
    <rect class="card" x="528" y="320" width="432" height="268" rx="16"/>
    <rect x="528" y="320" width="5" height="268" rx="2.5" fill="#F17E3F"/>
    <circle cx="576" cy="368" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(567 359)">
      <path d="M1 3 a2 2 0 0 1 2 -2 h12 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-8 l-4 4 z"/>
    </g>
    <text class="n" x="608" y="361">TOOL 2</text>
    <text class="ct" x="608" y="388">Shopify Sidekick</text>
    <g>
      <circle cx="568" cy="438" r="5" fill="#F17E3F"/>
      <text class="cb" x="588" y="444">Conversational help with store tasks</text>
      <circle cx="568" cy="482" r="5" fill="#F17E3F"/>
      <text class="cb" x="588" y="488">Inventory and order questions answered</text>
      <circle cx="568" cy="526" r="5" fill="#F17E3F"/>
      <text class="cb" x="588" y="532">Reports and insights on request</text>
    </g>
    <text class="cb" x="560" y="568">Knows Shopify, and the context of your store.</text>
  </g>

  <!-- what it automates -->
  <text class="lead" x="64" y="646">WHAT IT AUTOMATES</text>
  <g>
    <rect class="card" x="64" y="666" width="196" height="58" rx="29"/>
    <circle cx="102" cy="695" r="6" fill="#F17E3F"/>
    <text class="chip" x="122" y="701">Content</text>

    <rect class="card" x="276" y="666" width="276" height="58" rx="29"/>
    <circle cx="314" cy="695" r="6" fill="#F17E3F"/>
    <text class="chip" x="334" y="701">Personalisation</text>

    <rect class="card" x="568" y="666" width="186" height="58" rx="29"/>
    <circle cx="606" cy="695" r="6" fill="#F17E3F"/>
    <text class="chip" x="626" y="701">Support</text>

    <rect class="card" x="770" y="666" width="190" height="58" rx="29"/>
    <circle cx="808" cy="695" r="6" fill="#F17E3F"/>
    <text class="chip" x="828" y="701">Visuals</text>
  </g>

  <!-- footer -->
  <rect x="64" y="800" width="896" height="104" rx="16" fill="#16221F"/>
  <rect x="64" y="800" width="5" height="104" rx="2.5" fill="#F17E3F"/>
  <text class="fb" x="96" y="844">Text, images and audio, generated to your prompt</text>
  <text class="fs" x="96" y="874">No editing app to buy, no hours spent explaining the brief.</text>
</svg>
