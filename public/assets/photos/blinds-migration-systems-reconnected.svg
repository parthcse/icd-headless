<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 960" width="1024" height="960" role="img" aria-labelledby="t d">
  <title id="t">Production, pricing and business systems reconnected after a migration</title>
  <desc id="d">The new store at the centre, reconnected to the production feed, ERP, inventory, CRM, shipping and payments, with price lists still updated from a spreadsheet.</desc>

  <style>
    .h  { font: 700 37px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .sub{ font: 400 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .ct { font: 700 19px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .cb { font: 400 15.5px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .hub{ font: 700 22px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .hubs{ font: 400 14px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #B8C6C2; }
    .st { font: 700 19px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .sd { font: 400 15.5px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .fb { font: 700 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .fs { font: 400 16px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #B8C6C2; }
    .card { fill: #FFFFFF; stroke: #E2EAE8; stroke-width: 1.5; }
    .ico { fill: none; stroke: #F17E3F; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
    .wire { stroke: #C9DAD4; stroke-width: 2; stroke-dasharray: 5 6; fill: none; }
  </style>

  <rect width="1024" height="960" fill="#F3F7F6"/>
  <g stroke="#DCE8E4" stroke-width="1.5" fill="none">
    <path d="M0 140 L96 186 L170 112"/>
    <path d="M1024 180 L944 230 L876 176"/>
    <path d="M40 900 L132 846 L228 890"/>
  </g>
  <g fill="#DCE8E4">
    <circle cx="96" cy="186" r="5"/><circle cx="170" cy="112" r="3.5"/>
    <circle cx="944" cy="230" r="5"/><circle cx="876" cy="176" r="3.5"/>
    <circle cx="132" cy="846" r="5"/><circle cx="228" cy="890" r="3.5"/>
  </g>

  <text class="h" x="56" y="92">Systems Reconnected After the Move</text>
  <text class="sub" x="56" y="128">Orders keep reaching production while your team works as usual.</text>

  <!-- wires, drawn under the cards -->
  <g class="wire">
    <path d="M326 269 L392 372"/>
    <path d="M326 407 L392 407"/>
    <path d="M326 545 L392 442"/>
    <path d="M698 269 L632 372"/>
    <path d="M698 407 L632 407"/>
    <path d="M698 545 L632 442"/>
  </g>
  <g fill="#F17E3F">
    <circle cx="392" cy="372" r="4"/><circle cx="392" cy="407" r="4"/><circle cx="392" cy="442" r="4"/>
    <circle cx="632" cy="372" r="4"/><circle cx="632" cy="407" r="4"/><circle cx="632" cy="442" r="4"/>
  </g>

  <!-- hub -->
  <rect x="392" y="348" width="240" height="118" rx="16" fill="#16221F"/>
  <rect x="392" y="348" width="5" height="118" rx="2.5" fill="#F17E3F"/>
  <text class="hub" x="512" y="399" text-anchor="middle">Your New Store</text>
  <text class="hubs" x="512" y="425" text-anchor="middle">On the chosen platform</text>

  <!-- LEFT 1 · production feed -->
  <g>
    <rect class="card" x="56" y="210" width="270" height="118" rx="16"/>
    <rect x="56" y="210" width="5" height="118" rx="2.5" fill="#F17E3F"/>
    <circle cx="98" cy="252" r="18" fill="#FDEDE2"/>
    <g class="ico" transform="translate(88 242)"><path d="M19 1 L1 8.5 L8 11.5 L11 19 Z"/><path d="M19 1 L8 11.5"/></g>
    <text class="ct" x="128" y="259">Production Feed</text>
    <text class="cb" x="84" y="300">Email, API or EDI, however your</text>
    <text class="cb" x="84" y="320">vendor signs it off.</text>
  </g>

  <!-- LEFT 2 · ERP -->
  <g>
    <rect class="card" x="56" y="348" width="270" height="118" rx="16"/>
    <rect x="56" y="348" width="5" height="118" rx="2.5" fill="#F17E3F"/>
    <circle cx="98" cy="390" r="18" fill="#FDEDE2"/>
    <g class="ico" transform="translate(88 381)"><path d="M1 5 L10 1 L19 5 L10 9 Z"/><path d="M1 10 L10 14 L19 10"/><path d="M1 14.5 L10 18.5 L19 14.5"/></g>
    <text class="ct" x="128" y="397">ERP</text>
    <text class="cb" x="84" y="438">Orders, costs and product data</text>
    <text class="cb" x="84" y="458">flowing again.</text>
  </g>

  <!-- LEFT 3 · inventory -->
  <g>
    <rect class="card" x="56" y="486" width="270" height="118" rx="16"/>
    <rect x="56" y="486" width="5" height="118" rx="2.5" fill="#F17E3F"/>
    <circle cx="98" cy="528" r="18" fill="#FDEDE2"/>
    <g class="ico" transform="translate(88 518)"><path d="M10 1 L19 5.5 V14.5 L10 19 L1 14.5 V5.5 Z"/><path d="M1 5.5 L10 10 L19 5.5"/><path d="M10 10 V19"/></g>
    <text class="ct" x="128" y="535">Inventory</text>
    <text class="cb" x="84" y="576">Live stock levels across fabrics</text>
    <text class="cb" x="84" y="596">and components.</text>
  </g>

  <!-- RIGHT 1 · CRM -->
  <g>
    <rect class="card" x="698" y="210" width="270" height="118" rx="16"/>
    <rect x="698" y="210" width="5" height="118" rx="2.5" fill="#F17E3F"/>
    <circle cx="740" cy="252" r="18" fill="#FDEDE2"/>
    <g class="ico" transform="translate(730 242)"><circle cx="10" cy="6" r="4.5"/><path d="M2 19 C2 14 5.5 11.5 10 11.5 C14.5 11.5 18 14 18 19"/></g>
    <text class="ct" x="770" y="259">CRM</text>
    <text class="cb" x="726" y="300">Customer records and trade</text>
    <text class="cb" x="726" y="320">accounts in step.</text>
  </g>

  <!-- RIGHT 2 · shipping -->
  <g>
    <rect class="card" x="698" y="348" width="270" height="118" rx="16"/>
    <rect x="698" y="348" width="5" height="118" rx="2.5" fill="#F17E3F"/>
    <circle cx="740" cy="390" r="18" fill="#FDEDE2"/>
    <g class="ico" transform="translate(730 382)"><path d="M1 2 H12 V13 H1 Z"/><path d="M12 6 H16 L19 9.5 V13 H12 Z"/><circle cx="5.5" cy="16" r="2.2"/><circle cx="15" cy="16" r="2.2"/></g>
    <text class="ct" x="770" y="397">Shipping</text>
    <text class="cb" x="726" y="438">Rates and labels for long,</text>
    <text class="cb" x="726" y="458">oversized parcels.</text>
  </g>

  <!-- RIGHT 3 · payments -->
  <g>
    <rect class="card" x="698" y="486" width="270" height="118" rx="16"/>
    <rect x="698" y="486" width="5" height="118" rx="2.5" fill="#F17E3F"/>
    <circle cx="740" cy="528" r="18" fill="#FDEDE2"/>
    <g class="ico" transform="translate(730 520)"><rect x="1" y="2" width="18" height="13" rx="2.5"/><path d="M1 7 H19"/><path d="M4.5 11.5 H9"/></g>
    <text class="ct" x="770" y="535">Payments</text>
    <text class="cb" x="726" y="576">Gateways relinked and tested</text>
    <text class="cb" x="726" y="596">end to end.</text>
  </g>

  <!-- spreadsheet note -->
  <rect class="card" x="56" y="648" width="912" height="92" rx="16"/>
  <rect x="56" y="648" width="5" height="92" rx="2.5" fill="#F17E3F"/>
  <circle cx="106" cy="694" r="20" fill="#FDEDE2"/>
  <g class="ico" transform="translate(95 683)"><rect x="1" y="1" width="20" height="20" rx="2.5"/><path d="M1 7.5 H21"/><path d="M8 7.5 V21"/><path d="M1 14.5 H21"/></g>
  <text class="st" x="146" y="688">Price lists stay on your spreadsheet</text>
  <text class="sd" x="146" y="712">If that is how your team updates them today, nothing has to change.</text>

  <!-- footer -->
  <rect x="56" y="772" width="912" height="108" rx="16" fill="#16221F"/>
  <rect x="56" y="772" width="5" height="108" rx="2.5" fill="#F17E3F"/>
  <text class="fb" x="88" y="818">Orders reach production in every size and variant</text>
  <text class="fs" x="88" y="848">What we can connect depends on the API each system provides.</text>
</svg>
