<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 960" width="1024" height="960" role="img" aria-labelledby="t d">
  <title id="t">Is Shopify the right choice for your business</title>
  <desc id="d">Shopify at a glance: millions of live stores across 175+ countries on a PCI-DSS Level 1 hosted checkout, with scalability, app integrations, mobile themes and SEO built in, and selling across online, social, marketplace and in-person channels.</desc>

  <style>
    .h  { font: 700 37px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .sub{ font: 400 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .stat{ font: 700 40px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .cb { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .chip { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .lead { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .fb { font: 700 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .fs { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #B8C6C2; }
    .card { fill: #FFFFFF; stroke: #E2EAE8; stroke-width: 1.5; }
    .ico { fill: none; stroke: #F17E3F; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1024" height="960" fill="#F3F7F6"/>
  <g stroke="#DCE8E4" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M0 142 L110 188 L184 114"/>
    <path d="M1024 214 L938 262"/>
    <path d="M1024 884 L936 862"/>
  </g>
  <g fill="#DCE8E4">
    <circle cx="110" cy="188" r="5"/><circle cx="184" cy="114" r="3.5"/>
    <circle cx="938" cy="262" r="5"/><circle cx="936" cy="862" r="4"/>
  </g>

  <text class="h" x="64" y="92">Is Shopify Right for You?</text>
  <text class="sub" x="64" y="128">What the platform gives you before you write any code.</text>

  <!-- platform stats -->
  <g>
    <rect class="card" x="64" y="176" width="288" height="152" rx="16"/>
    <rect x="64" y="176" width="5" height="152" rx="2.5" fill="#F17E3F"/>
    <text class="stat" x="96" y="250">Millions</text>
    <text class="cb" x="96" y="282">of live stores worldwide</text>

    <rect class="card" x="368" y="176" width="288" height="152" rx="16"/>
    <rect x="368" y="176" width="5" height="152" rx="2.5" fill="#F17E3F"/>
    <text class="stat" x="400" y="250">175+</text>
    <text class="cb" x="400" y="282">countries selling on it</text>

    <rect class="card" x="672" y="176" width="288" height="152" rx="16"/>
    <rect x="672" y="176" width="5" height="152" rx="2.5" fill="#F17E3F"/>
    <text class="stat" x="704" y="250">Level 1</text>
    <text class="cb" x="704" y="282">PCI-DSS hosted checkout</text>
  </g>

  <!-- built in -->
  <text class="lead" x="64" y="372">BUILT IN, OUT OF THE BOX</text>
  <g>
    <rect class="card" x="64" y="390" width="288" height="58" rx="29"/>
    <circle cx="102" cy="419" r="6" fill="#F17E3F"/>
    <text class="chip" x="122" y="425">No dev skills needed</text>

    <rect class="card" x="368" y="390" width="288" height="58" rx="29"/>
    <circle cx="406" cy="419" r="6" fill="#F17E3F"/>
    <text class="chip" x="426" y="425">Scalable infrastructure</text>

    <rect class="card" x="672" y="390" width="288" height="58" rx="29"/>
    <circle cx="710" cy="419" r="6" fill="#F17E3F"/>
    <text class="chip" x="730" y="425">Secure checkout</text>

    <rect class="card" x="64" y="462" width="288" height="58" rx="29"/>
    <circle cx="102" cy="491" r="6" fill="#F17E3F"/>
    <text class="chip" x="122" y="497">App integrations</text>

    <rect class="card" x="368" y="462" width="288" height="58" rx="29"/>
    <circle cx="406" cy="491" r="6" fill="#F17E3F"/>
    <text class="chip" x="426" y="497">Mobile-optimized themes</text>

    <rect class="card" x="672" y="462" width="288" height="58" rx="29"/>
    <circle cx="710" cy="491" r="6" fill="#F17E3F"/>
    <text class="chip" x="730" y="497">SEO and blogging</text>
  </g>

  <!-- channels -->
  <text class="lead" x="64" y="566">SELL ACROSS EVERY CHANNEL</text>
  <g>
    <rect class="card" x="64" y="584" width="212" height="140" rx="16"/>
    <rect x="64" y="584" width="5" height="140" rx="2.5" fill="#F17E3F"/>
    <circle cx="112" cy="630" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(102 621)">
      <rect x="1" y="2" width="16" height="12" rx="1.5"/><path d="M6 18 h6"/>
    </g>
    <text class="chip" x="96" y="690">Online store</text>

    <rect class="card" x="292" y="584" width="212" height="140" rx="16"/>
    <rect x="292" y="584" width="5" height="140" rx="2.5" fill="#F17E3F"/>
    <circle cx="340" cy="630" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(331 621)">
      <circle cx="4" cy="9" r="3"/><circle cx="14" cy="3.5" r="3"/><circle cx="14" cy="14.5" r="3"/>
      <path d="M6.6 7.6 L11.4 5"/><path d="M6.6 10.4 L11.4 13"/>
    </g>
    <text class="chip" x="324" y="690">Social</text>

    <rect class="card" x="520" y="584" width="212" height="140" rx="16"/>
    <rect x="520" y="584" width="5" height="140" rx="2.5" fill="#F17E3F"/>
    <circle cx="568" cy="630" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(558 621)">
      <path d="M1 6 L3 1 h14 l2 5"/><path d="M2 6 v11 h16 V6"/><path d="M1 6 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0"/>
    </g>
    <text class="chip" x="552" y="690">Marketplaces</text>

    <rect class="card" x="748" y="584" width="212" height="140" rx="16"/>
    <rect x="748" y="584" width="5" height="140" rx="2.5" fill="#F17E3F"/>
    <circle cx="796" cy="630" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(786 621)">
      <rect x="1" y="4" width="18" height="11" rx="2"/><path d="M1 8 h18"/>
    </g>
    <text class="chip" x="780" y="690">In person</text>
  </g>

  <!-- footer -->
  <rect x="64" y="790" width="896" height="104" rx="16" fill="#16221F"/>
  <rect x="64" y="790" width="5" height="104" rx="2.5" fill="#F17E3F"/>
  <text class="fb" x="96" y="834">Fully hosted, so there is no server to run</text>
  <text class="fs" x="96" y="864">You manage the store; Shopify handles updates, uptime and compliance.</text>
</svg>
