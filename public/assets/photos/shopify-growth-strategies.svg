<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 960" width="1024" height="960" role="img" aria-labelledby="t d">
  <title id="t">Proven Shopify strategies for growing an online store</title>
  <desc id="d">A three-step path — define, build, convert — feeding a repeating loop of audit, prioritise, ship and measure, producing repeat visits, a memorable experience and long-term growth.</desc>

  <style>
    .h  { font: 700 37px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .sub{ font: 400 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .ct { font: 700 23px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .cb { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .n  { font: 700 16px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #F17E3F; }
    .chip { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .lead { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .loop { font: 400 16px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #8C9C98; }
    .fb { font: 700 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .fs { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #B8C6C2; }
    .card { fill: #FFFFFF; stroke: #E2EAE8; stroke-width: 1.5; }
    .ico { fill: none; stroke: #F17E3F; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .arw { fill: none; stroke: #C6D6D2; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1024" height="960" fill="#F3F7F6"/>
  <g stroke="#DCE8E4" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M0 148 L112 192 L188 118"/>
    <path d="M1024 244 L936 294"/>
    <path d="M1024 880 L938 862"/>
  </g>
  <g fill="#DCE8E4">
    <circle cx="112" cy="192" r="5"/><circle cx="188" cy="118" r="3.5"/>
    <circle cx="936" cy="294" r="5"/><circle cx="938" cy="862" r="4"/>
  </g>

  <text class="h" x="64" y="92">Proven Shopify Growth Strategies</text>
  <text class="sub" x="64" y="128">Targeted, results-focused, built around your goals.</text>

  <!-- step 1 -->
  <g>
    <rect class="card" x="64" y="176" width="272" height="232" rx="16"/>
    <rect x="64" y="176" width="5" height="232" rx="2.5" fill="#F17E3F"/>
    <circle cx="112" cy="224" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(102 214)">
      <circle cx="9" cy="9" r="8"/><circle cx="9" cy="9" r="3"/>
    </g>
    <text class="n" x="144" y="217">STEP 1</text>
    <text class="ct" x="144" y="243">Define</text>
    <text class="cb" x="96" y="296">What defines your</text>
    <text class="cb" x="96" y="320">business, who you sell</text>
    <text class="cb" x="96" y="344">to, and where the</text>
    <text class="cb" x="96" y="368">growth is.</text>
  </g>

  <path class="arw" d="M340 292 H372"/>
  <path class="arw" d="M364 286 L372 292 L364 298"/>

  <!-- step 2 -->
  <g>
    <rect class="card" x="376" y="176" width="272" height="232" rx="16"/>
    <rect x="376" y="176" width="5" height="232" rx="2.5" fill="#F17E3F"/>
    <circle cx="424" cy="224" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(414 215)">
      <path d="M2 2 h14 v6 h-14 z"/><path d="M2 12 h14 v6 h-14 z"/>
    </g>
    <text class="n" x="456" y="217">STEP 2</text>
    <text class="ct" x="456" y="243">Build</text>
    <text class="cb" x="408" y="296">Setup, custom</text>
    <text class="cb" x="408" y="320">functionality and the</text>
    <text class="cb" x="408" y="344">integrations that</text>
    <text class="cb" x="408" y="368">streamline workflows.</text>
  </g>

  <path class="arw" d="M652 292 H684"/>
  <path class="arw" d="M676 286 L684 292 L676 298"/>

  <!-- step 3 -->
  <g>
    <rect class="card" x="688" y="176" width="272" height="232" rx="16"/>
    <rect x="688" y="176" width="5" height="232" rx="2.5" fill="#F17E3F"/>
    <circle cx="736" cy="224" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(726 215)">
      <path d="M1 14 L6.5 8 L11 11.5 L18 3"/><path d="M13.5 3 h4.5 v4.5"/>
    </g>
    <text class="n" x="768" y="217">STEP 3</text>
    <text class="ct" x="768" y="243">Convert</text>
    <text class="cb" x="720" y="296">UX/UI design, site</text>
    <text class="cb" x="720" y="320">speed and conversion</text>
    <text class="cb" x="720" y="344">strategies that keep</text>
    <text class="cb" x="720" y="368">people buying.</text>
  </g>

  <!-- the loop -->
  <g>
    <rect class="card" x="64" y="448" width="896" height="216" rx="16"/>
    <rect x="64" y="448" width="5" height="216" rx="2.5" fill="#F17E3F"/>
    <text class="ct" x="96" y="492">Then we keep going</text>
    <text class="cb" x="96" y="520">Proactive and responsive, so the store stays competitive in a fast-moving market.</text>

    <rect x="96" y="548" width="176" height="56" rx="28" fill="#F3F7F6" stroke="#E2EAE8" stroke-width="1.5"/>
    <text class="chip" x="146" y="582">Audit</text>
    <path class="arw" d="M280 576 H300"/><path class="arw" d="M292 570 L300 576 L292 582"/>

    <rect x="304" y="548" width="176" height="56" rx="28" fill="#F3F7F6" stroke="#E2EAE8" stroke-width="1.5"/>
    <text class="chip" x="338" y="582">Prioritise</text>
    <path class="arw" d="M488 576 H508"/><path class="arw" d="M500 570 L508 576 L500 582"/>

    <rect x="512" y="548" width="176" height="56" rx="28" fill="#F3F7F6" stroke="#E2EAE8" stroke-width="1.5"/>
    <text class="chip" x="578" y="582">Ship</text>
    <path class="arw" d="M696 576 H716"/><path class="arw" d="M708 570 L716 576 L708 582"/>

    <rect x="720" y="548" width="176" height="56" rx="28" fill="#F3F7F6" stroke="#E2EAE8" stroke-width="1.5"/>
    <text class="chip" x="762" y="582">Measure</text>

    <path class="arw" stroke-dasharray="6 6" d="M808 608 V634 H184 V608"/>
    <path class="arw" d="M178 616 L184 608 L190 616"/>
    <text class="loop" x="420" y="652">repeat visits inform the next release</text>
  </g>

  <!-- outcomes -->
  <text class="lead" x="64" y="702">WHAT IT PRODUCES</text>
  <g>
    <rect class="card" x="64" y="722" width="268" height="56" rx="28"/>
    <circle cx="102" cy="750" r="6" fill="#F17E3F"/>
    <text class="chip" x="122" y="756">Repeat visits</text>

    <rect class="card" x="348" y="722" width="312" height="56" rx="28"/>
    <circle cx="386" cy="750" r="6" fill="#F17E3F"/>
    <text class="chip" x="406" y="756">Memorable experience</text>

    <rect class="card" x="676" y="722" width="284" height="56" rx="28"/>
    <circle cx="714" cy="750" r="6" fill="#F17E3F"/>
    <text class="chip" x="734" y="756">Long-term growth</text>
  </g>

  <!-- footer -->
  <rect x="64" y="800" width="896" height="104" rx="16" fill="#16221F"/>
  <rect x="64" y="800" width="5" height="104" rx="2.5" fill="#F17E3F"/>
  <text class="fb" x="96" y="844">Every feature earns its place</text>
  <text class="fs" x="96" y="874">Crafted so it contributes to a smooth, engaging customer journey.</text>
</svg>
