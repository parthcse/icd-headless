<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 960" width="1024" height="960" role="img" aria-labelledby="t d">
  <title id="t">Protecting rankings during a blinds website migration</title>
  <desc id="d">Four stages: URL inventory, 301 redirect map, metadata and schema transfer, and post-launch monitoring. Every URL is kept, redirected or retired.</desc>

  <style>
    .h  { font: 700 37px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .sub{ font: 400 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .ct { font: 700 23px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .cb { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .n  { font: 700 16px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #F17E3F; }
    .chip { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #16221F; }
    .lead { font: 700 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #5A6B68; }
    .fb { font: 700 20px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #FFFFFF; }
    .fs { font: 400 17px "Gilroy", "Segoe UI", Helvetica, Arial, sans-serif; fill: #B8C6C2; }
    .card { fill: #FFFFFF; stroke: #E2EAE8; stroke-width: 1.5; }
    .ico { fill: none; stroke: #F17E3F; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1024" height="960" fill="#F3F7F6"/>
  <!-- faint network motif, matching the other section illustrations -->
  <g stroke="#DCE8E4" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M0 150 L120 196 L196 120"/>
    <path d="M1024 250 L930 300 L860 244"/>
    <path d="M60 880 L150 820 L250 866"/>
    <path d="M1024 820 L940 862"/>
  </g>
  <g fill="#DCE8E4">
    <circle cx="120" cy="196" r="5"/><circle cx="196" cy="120" r="3.5"/>
    <circle cx="930" cy="300" r="5"/><circle cx="860" cy="244" r="3.5"/>
    <circle cx="150" cy="820" r="5"/><circle cx="250" cy="866" r="3.5"/>
    <circle cx="940" cy="862" r="4"/>
  </g>

  <text class="h" x="56" y="92">Protecting Rankings in a Migration</text>
  <text class="sub" x="56" y="128">Mapped before the build, checked after go-live.</text>

  <!-- 1 · URL inventory -->
  <g>
    <rect class="card" x="56" y="176" width="440" height="200" rx="16"/>
    <rect x="56" y="176" width="5" height="200" rx="2.5" fill="#F17E3F"/>
    <circle cx="104" cy="224" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(94 214)">
      <circle cx="8.5" cy="8.5" r="7"/><path d="M13.6 13.6 L19 19"/>
    </g>
    <text class="n" x="136" y="217">STEP 1</text>
    <text class="ct" x="136" y="243">URL Inventory</text>
    <text class="cb" x="88" y="296">Built from a site crawl, Search Console</text>
    <text class="cb" x="88" y="322">and analytics, so the pages that earn</text>
    <text class="cb" x="88" y="348">traffic get the most care.</text>
  </g>

  <!-- 2 · redirect map -->
  <g>
    <rect class="card" x="528" y="176" width="440" height="200" rx="16"/>
    <rect x="528" y="176" width="5" height="200" rx="2.5" fill="#F17E3F"/>
    <circle cx="576" cy="224" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(566 215)">
      <path d="M1 13 C1 5.5 6.5 2 13 2"/><path d="M9.5 -1.5 L13.5 2 L9.5 5.5"/><path d="M1 16.5 L1 18"/>
    </g>
    <text class="n" x="608" y="217">STEP 2</text>
    <text class="ct" x="608" y="243">301 Redirect Map</text>
    <text class="cb" x="560" y="296">Categories, products, fabrics and guides,</text>
    <text class="cb" x="560" y="322">plus rules for filter and parameter URLs</text>
    <text class="cb" x="560" y="348">and canonical tags.</text>
  </g>

  <!-- 3 · metadata and schema -->
  <g>
    <rect class="card" x="56" y="408" width="440" height="200" rx="16"/>
    <rect x="56" y="408" width="5" height="200" rx="2.5" fill="#F17E3F"/>
    <circle cx="104" cy="456" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(95 446)">
      <path d="M2 2 h11 l5 5 v13 a1 1 0 0 1 -1 1 h-15 a1 1 0 0 1 -1 -1 v-17 a1 1 0 0 1 1 -1 z"/>
      <path d="M13 2 v5 h5"/><path d="M5.5 13 h9"/><path d="M5.5 17 h6"/>
    </g>
    <text class="n" x="136" y="449">STEP 3</text>
    <text class="ct" x="136" y="475">Metadata and Schema</text>
    <text class="cb" x="88" y="528">Titles, meta descriptions, headings and</text>
    <text class="cb" x="88" y="554">structured data carried across to the</text>
    <text class="cb" x="88" y="580">new store.</text>
  </g>

  <!-- 4 · monitoring -->
  <g>
    <rect class="card" x="528" y="408" width="440" height="200" rx="16"/>
    <rect x="528" y="408" width="5" height="200" rx="2.5" fill="#F17E3F"/>
    <circle cx="576" cy="456" r="19" fill="#FDEDE2"/>
    <g class="ico" transform="translate(566 447)">
      <path d="M1 15 L6.5 9 L11 12.5 L19 3"/><path d="M14.5 3 h4.5 v4.5"/>
    </g>
    <text class="n" x="608" y="449">STEP 4</text>
    <text class="ct" x="608" y="475">Post-Launch Checks</text>
    <text class="cb" x="560" y="528">Crawl errors and 404 pages watched in</text>
    <text class="cb" x="560" y="554">Search Console, so problems surface</text>
    <text class="cb" x="560" y="580">and get fixed quickly.</text>
  </g>

  <!-- every URL gets a decision -->
  <text class="lead" x="56" y="676">EVERY URL GETS A DECISION</text>
  <g>
    <rect class="card" x="56" y="698" width="150" height="58" rx="29"/>
    <circle cx="94" cy="727" r="6" fill="#F17E3F"/>
    <text class="chip" x="114" y="733">Keep</text>

    <rect class="card" x="222" y="698" width="196" height="58" rx="29"/>
    <circle cx="260" cy="727" r="6" fill="#F17E3F"/>
    <text class="chip" x="280" y="733">Redirect</text>

    <rect class="card" x="434" y="698" width="168" height="58" rx="29"/>
    <circle cx="472" cy="727" r="6" fill="#F17E3F"/>
    <text class="chip" x="492" y="733">Retire</text>
  </g>

  <!-- footer -->
  <rect x="56" y="800" width="912" height="104" rx="16" fill="#16221F"/>
  <rect x="56" y="800" width="5" height="104" rx="2.5" fill="#F17E3F"/>
  <text class="fb" x="88" y="844">XML sitemap submitted, GA4 tracking live</text>
  <text class="fs" x="88" y="874">Sample requests, quotes and orders measured from day one.</text>
</svg>
